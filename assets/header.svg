<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="0.55" stop-color="#1a0b3d"/>
      <stop offset="1" stop-color="#06163a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#06b6d4" stop-opacity=".45"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <style>
    .n{fill:#a78bfa}
    .e{stroke:#8b5cf6;stroke-opacity:.25;stroke-width:1.2}
    .p{fill:#22d3ee}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'Fira Code','JetBrains Mono',Consolas,monospace}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .fade{opacity:0;animation:fade 1.2s ease-out forwards}
    @keyframes fade{to{opacity:1}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="180" cy="60" r="220" fill="url(#glow1)">
      <animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="260" r="240" fill="url(#glow2)">
      <animate attributeName="cy" values="260;200;260" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- neural network, right side -->
    <g transform="translate(820 60)">
      <g class="e">
        <line x1="0" y1="20" x2="120" y2="0"/><line x1="0" y1="20" x2="120" y2="90"/><line x1="0" y1="20" x2="120" y2="180"/>
        <line x1="0" y1="100" x2="120" y2="0"/><line x1="0" y1="100" x2="120" y2="90"/><line x1="0" y1="100" x2="120" y2="180"/>
        <line x1="0" y1="180" x2="120" y2="0"/><line x1="0" y1="180" x2="120" y2="90"/><line x1="0" y1="180" x2="120" y2="180"/>
        <line x1="120" y1="0" x2="240" y2="50"/><line x1="120" y1="0" x2="240" y2="140"/>
        <line x1="120" y1="90" x2="240" y2="50"/><line x1="120" y1="90" x2="240" y2="140"/>
        <line x1="120" y1="180" x2="240" y2="50"/><line x1="120" y1="180" x2="240" y2="140"/>
        <line x1="240" y1="50" x2="320" y2="95"/><line x1="240" y1="140" x2="320" y2="95"/>
      </g>
      <!-- signals travelling -->
      <circle r="3.5" class="p"><animateMotion dur="2.4s" repeatCount="indefinite" path="M0 20L120 90L240 140L320 95"/></circle>
      <circle r="3.5" class="p"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M0 180L120 0L240 50L320 95"/></circle>
      <circle r="3.5" fill="#c084fc"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M0 100L120 180L240 140L320 95"/></circle>
      <g>
        <circle cx="0" cy="20" r="8" class="n pulse"/><circle cx="0" cy="100" r="8" class="n pulse" style="animation-delay:.5s"/><circle cx="0" cy="180" r="8" class="n pulse" style="animation-delay:1s"/>
        <circle cx="120" cy="0" r="8" class="n pulse" style="animation-delay:.3s"/><circle cx="120" cy="90" r="8" class="n pulse" style="animation-delay:.9s"/><circle cx="120" cy="180" r="8" class="n pulse" style="animation-delay:1.4s"/>
        <circle cx="240" cy="50" r="8" class="n pulse" style="animation-delay:.7s"/><circle cx="240" cy="140" r="8" class="n pulse" style="animation-delay:1.2s"/>
        <circle cx="320" cy="95" r="11" fill="#22d3ee" class="pulse"/>
      </g>
    </g>

    <!-- text -->
    <g class="t">
      <text x="70" y="92" fill="#94a3b8" font-size="20" class="mono fade">&gt; hello_world.py</text>
      <text x="70" y="160" font-size="62" font-weight="800" fill="url(#txt)" class="fade" style="animation-delay:.3s">Shreya Roshan</text>
      <text x="70" y="205" font-size="24" fill="#e2e8f0" font-weight="500" class="fade" style="animation-delay:.6s">AI Engineer · ML · MLOps · GenAI · Medical CV</text>
      <text x="70" y="250" font-size="17" fill="#a5b4fc" class="mono fade" style="animation-delay:.9s">from research notebooks → production systems<tspan class="blink" fill="#22d3ee"> ▌</tspan></text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="none" stroke="url(#txt)" stroke-opacity=".5" stroke-width="2"/>
</svg>
