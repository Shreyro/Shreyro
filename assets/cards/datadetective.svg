<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140a2e"/><stop offset="1" stop-color="#0a1128"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#8b5cf6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="g"><stop offset="0" stop-color="#f472b6" stop-opacity=".35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="480" height="250" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .tag{font-size:12px;fill:#e2e8f0;font-weight:600}
    .dot{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.25}}
  </style>
  <g clip-path="url(#c)">
    <rect width="480" height="250" fill="url(#b)"/>
    <circle cx="430" cy="30" r="150" fill="url(#g)"><animate attributeName="r" values="140;170;140" dur="5s" repeatCount="indefinite"/></circle>
    <text x="32" y="52" font-size="28">🔎</text>
    <text x="72" y="50" font-size="24" font-weight="800" fill="#f8fafc">Data Detective</text>
    <text x="448" y="82" font-size="11" font-weight="700" fill="#8b5cf6" text-anchor="end" letter-spacing="1.2">AI AGENT</text>
    <circle cx="452" cy="40" r="0" />
    <text x="32" y="82" font-size="14" font-weight="600" fill="#8b5cf6">Autonomous analytics agent</text>
    <text y="116" font-size="14.5" fill="#cbd5e1"><tspan x="32" dy="0">Plain-English question → validated SQL → charts →</tspan><tspan x="32" dy="22">findings where every number is traced to evidence.</tspan></text>
    <g transform="translate(0 196)"><g transform="translate(32 0)"><rect width="68" height="26" rx="13" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".45"/><text x="34" y="17.5" text-anchor="middle" class="tag">Claude</text></g><g transform="translate(108 0)"><rect width="68" height="26" rx="13" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".45"/><text x="34" y="17.5" text-anchor="middle" class="tag">DuckDB</text></g><g transform="translate(183 0)"><rect width="75" height="26" rx="13" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".45"/><text x="38" y="17.5" text-anchor="middle" class="tag">sqlglot</text></g><g transform="translate(266 0)"><rect width="68" height="26" rx="13" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".45"/><text x="34" y="17.5" text-anchor="middle" class="tag">Plotly</text></g><g transform="translate(342 0)"><rect width="75" height="26" rx="13" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".45"/><text x="38" y="17.5" text-anchor="middle" class="tag">FastAPI</text></g></g>
  </g>
  <rect x="1" y="1" width="478" height="248" rx="18" fill="none" stroke="url(#a)" stroke-width="2"/>
</svg>
