<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c4"/><stop offset=".45" stop-color="#e9b949"/><stop offset="1" stop-color="#a8741c"/>
    </linearGradient>
    <linearGradient id="sysline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc3ff" stop-opacity="0"/><stop offset=".5" stop-color="#7dd8ff"/><stop offset="1" stop-color="#4cc3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060d"/><stop offset="1" stop-color="#0a1024"/></linearGradient>
  </defs>
  <style>
  @font-face{font-family:'Cinzel';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
  .serif{font-family:'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif;font-weight:700}
  .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
  .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
  .tw{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  .rn{animation:rn 3.2s ease-in-out infinite}
  @keyframes rn{0%,100%{opacity:.25}50%{opacity:1}}
  .wing{transform-box:fill-box;transform-origin:85% 100%;animation:flap .9s ease-in-out infinite}
  .wing-far{transform-box:fill-box;transform-origin:10% 100%;animation:flap .9s ease-in-out infinite}
  @keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.25)}}
  .eye{animation:rn 1.6s ease-in-out infinite}
  .fade{opacity:0;animation:fade 1s ease-out forwards}
  @keyframes fade{to{opacity:1}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .scan{animation:scan 5s linear infinite}
  @keyframes scan{0%{transform:translateY(-20px)}100%{transform:translateY(420px)}}

    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  </style>
  <rect width="1000" height="260" rx="14" fill="url(#bg)"/>
  <circle cx="452" cy="146" r="1.2" fill="#fff" class="tw" style="animation-duration:3.8s;animation-delay:-4.3s"/><circle cx="190" cy="209" r="1.2" fill="#fff" class="tw" style="animation-duration:4.5s;animation-delay:-4.0s"/><circle cx="94" cy="79" r="0.6" fill="#fff" class="tw" style="animation-duration:4.2s;animation-delay:-4.5s"/><circle cx="634" cy="155" r="1.2" fill="#fff" class="tw" style="animation-duration:5.9s;animation-delay:-3.3s"/><circle cx="616" cy="41" r="0.6" fill="#fff" class="tw" style="animation-duration:5.3s;animation-delay:-0.3s"/><circle cx="36" cy="229" r="1.6" fill="#fff" class="tw" style="animation-duration:2.1s;animation-delay:-2.3s"/><circle cx="441" cy="219" r="1.6" fill="#fff" class="tw" style="animation-duration:2.9s;animation-delay:-1.5s"/><circle cx="5" cy="22" r="1" fill="#fff" class="tw" style="animation-duration:3.6s;animation-delay:-2.8s"/><circle cx="932" cy="22" r="1" fill="#fff" class="tw" style="animation-duration:3.3s;animation-delay:-1.1s"/><circle cx="289" cy="18" r="0.6" fill="#fff" class="tw" style="animation-duration:3.6s;animation-delay:-4.2s"/><circle cx="387" cy="249" r="0.6" fill="#fff" class="tw" style="animation-duration:2.9s;animation-delay:-4.6s"/><circle cx="52" cy="98" r="1.2" fill="#fff" class="tw" style="animation-duration:3.7s;animation-delay:-2.8s"/><circle cx="198" cy="175" r="1" fill="#fff" class="tw" style="animation-duration:2.3s;animation-delay:-1.7s"/><circle cx="964" cy="197" r="0.6" fill="#fff" class="tw" style="animation-duration:2.5s;animation-delay:-3.5s"/><circle cx="11" cy="121" r="1.2" fill="#fff" class="tw" style="animation-duration:2.7s;animation-delay:-2.8s"/><circle cx="447" cy="50" r="0.8" fill="#fff" class="tw" style="animation-duration:3.7s;animation-delay:-1.9s"/><circle cx="395" cy="257" r="0.6" fill="#fff" class="tw" style="animation-duration:3.1s;animation-delay:-4.9s"/><circle cx="803" cy="79" r="0.6" fill="#fff" class="tw" style="animation-duration:2.8s;animation-delay:-2.0s"/><circle cx="854" cy="167" r="0.6" fill="#fff" class="tw" style="animation-duration:2.2s;animation-delay:-0.7s"/><circle cx="442" cy="2" r="1.6" fill="#fff" class="tw" style="animation-duration:3.3s;animation-delay:-1.5s"/><circle cx="73" cy="23" r="1.6" fill="#fff" class="tw" style="animation-duration:4.5s;animation-delay:-0.1s"/><circle cx="369" cy="162" r="0.8" fill="#fff" class="tw" style="animation-duration:5.8s;animation-delay:-2.4s"/><circle cx="575" cy="225" r="0.8" fill="#fff" class="tw" style="animation-duration:4.5s;animation-delay:-1.6s"/><circle cx="228" cy="159" r="0.8" fill="#fff" class="tw" style="animation-duration:2.6s;animation-delay:-3.1s"/><circle cx="554" cy="179" r="1.2" fill="#fff" class="tw" style="animation-duration:5.5s;animation-delay:-3.0s"/><circle cx="421" cy="27" r="0.6" fill="#fff" class="tw" style="animation-duration:4.0s;animation-delay:-1.3s"/><circle cx="740" cy="102" r="1.2" fill="#fff" class="tw" style="animation-duration:5.3s;animation-delay:-3.0s"/><circle cx="293" cy="46" r="0.6" fill="#fff" class="tw" style="animation-duration:2.5s;animation-delay:-2.4s"/><circle cx="654" cy="160" r="0.6" fill="#fff" class="tw" style="animation-duration:3.1s;animation-delay:-4.6s"/><circle cx="204" cy="4" r="1" fill="#fff" class="tw" style="animation-duration:3.6s;animation-delay:-1.2s"/><circle cx="47" cy="73" r="1.6" fill="#fff" class="tw" style="animation-duration:4.3s;animation-delay:-0.7s"/><circle cx="362" cy="232" r="1" fill="#fff" class="tw" style="animation-duration:4.6s;animation-delay:-3.5s"/><circle cx="584" cy="36" r="0.6" fill="#fff" class="tw" style="animation-duration:5.7s;animation-delay:-2.4s"/><circle cx="357" cy="81" r="0.6" fill="#fff" class="tw" style="animation-duration:2.1s;animation-delay:-3.2s"/><circle cx="482" cy="190" r="1" fill="#fff" class="tw" style="animation-duration:2.5s;animation-delay:-0.4s"/>
  <rect x="20" y="30" width="960" height="210" rx="6" fill="#070d1f" fill-opacity=".82" stroke="#e9b949" stroke-opacity=".55" stroke-width="1.2"/><path d="M20 46V30H36 M964 30H980V46 M980 224V240H964 M36 240H20V224" fill="none" stroke="#e9b949" stroke-width="3" filter="url(#glow)"/><rect x="440" y="17" width="121" height="26" rx="3" fill="#070d1f" stroke="#e9b949" stroke-width="1.2"/><text x="500" y="35" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#e9b949" letter-spacing="3" filter="url(#glow)">NEW QUEST</text>
  <text x="500.0" y="86" text-anchor="middle" class="serif" font-size="30" fill="url(#gold)" letter-spacing="3" filter="url(#glow)">Recruit the Player</text>
  <g class="mono" font-size="15">
    <text x="120" y="128" fill="#7f93b3" letter-spacing="2">OBJECTIVE</text>
    <text x="270" y="128" fill="#d6e4f5">Start a conversation about an AI / ML / Data Science role</text>
    <text x="120" y="158" fill="#7f93b3" letter-spacing="2">REWARD</text>
    <text x="270" y="158" fill="#d6e4f5">An engineer who ships production-grade ML, not just notebooks</text>
  </g>
  <g transform="translate(350.0 186)">
    <rect width="130" height="34" rx="4" fill="#4cc3ff" fill-opacity=".15" stroke="#4cc3ff" class="pulse" filter="url(#glow)"/>
    <text x="65" y="22" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#7dd8ff" letter-spacing="3">▸ ACCEPT</text>
    <rect x="170" width="130" height="34" rx="4" fill="none" stroke="#7f93b3" stroke-opacity=".35"/>
    <text x="235" y="22" text-anchor="middle" class="mono" font-size="14" fill="#7f93b3" fill-opacity=".45" letter-spacing="3" text-decoration="line-through">DECLINE</text>
  </g>
</svg>